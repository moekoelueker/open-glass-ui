name: Release

# Publishing is deliberately tag-triggered and manual-dispatchable rather than
# automatic on push: a release should be an explicit act.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run every gate and pack the tarball without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm provenance: the workflow exchanges this OIDC token for
      # an attestation binding the tarball to this commit and workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # No registry-url: it writes an _authToken line to .npmrc, which makes
          # npm skip the trusted-publishing (OIDC) exchange and fail with E404.
          # See actions/setup-node#1551.

      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Full release gate
        run: pnpm run release:check

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-report
          path: artifacts/packages/
          retention-days: 30

      - name: Pack only (dry run)
        if: inputs.dry-run
        run: pnpm --filter open-glass-ui pack --pack-destination ./artifacts/packages

      # Trusted publishing (OIDC): npm verifies this exact repository,
      # workflow, and environment, so no long-lived token exists to leak or
      # expire, and provenance is attached automatically. The tarball is
      # packed by pnpm (which rewrites workspace: ranges) and published by the
      # npm CLI directly, so any registry refusal prints npm's own message.
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: |
          npm install --global npm@^11.5.1
          npm --version
          pnpm --filter open-glass-ui pack --pack-destination ./release
          # Verbose so a failed OIDC exchange prints its reason; npm redacts
          # credentials in its logs.
          npm publish ./release/open-glass-ui-*.tgz --access public --loglevel verbose
